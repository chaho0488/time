<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>울산에너지고 시간표</title>
<!-- 들머리 화면: 각 사이트로 가는 단추만 있다. 사이트마다 주소가 따로라 여기서는 아무것도 미리 불러오지 않는다(가볍게 열림) -->
<style>
  :root { --ink: #14213D; --sub: #5A6478; --paper: #F3F6FA; --line: #D9E0EA; --warm: #F2A93B; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; }
  main { max-width: 560px; margin: 0 auto; padding: 12vh 20px 40px; }
  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.02em; margin: 0 0 4px; }
  p { margin: 0 0 22px; color: var(--sub); }
  nav { display: grid; gap: 12px; }
  a { display: block; padding: 16px 18px; border: 1.5px solid var(--ink); border-radius: 12px; background: #fff; color: var(--ink); text-decoration: none; }
  a b { display: block; font-size: 1.15rem; font-weight: 800; }
  a span { font-size: .9rem; color: var(--sub); }
  a:hover, a:focus-visible { background: var(--ink); color: #fff; outline: 3px solid var(--warm); outline-offset: 2px; }
  a:hover span, a:focus-visible span { color: #C9D3E6; }
  .admin { margin-top: 14px; }
  .admin a { padding: 10px 18px; border-color: var(--line); background: transparent; }
  .admin a b { font-size: .95rem; font-weight: 700; color: var(--sub); }
  .admin a:hover b, .admin a:focus-visible b { color: #fff; }
  /* 메뉴 아래: 그 화면의 주소 + 복사 단추(네모 두 개가 겹친 그림) */
  .addr { display: flex; align-items: center; gap: 6px; margin: 4px 4px 0 18px; font-size: .82rem; color: var(--sub); min-height: 30px; }
  .addr span { overflow-wrap: anywhere; }
  .copy { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .copy:hover, .copy:focus-visible { border-color: var(--ink); outline: none; }
  .addr em { font-style: normal; font-weight: 700; color: #1F7A5C; }
</style>
</head>
<body>
<main>
  <h1>울산에너지고 시간표</h1>
  <p>필요한 화면을 누르면 바로 이동합니다.</p>
  <nav>
    <div class="item">
      <a href="/view"><b>시간표 보기</b><span>교사·학급 시간표 (교체·대강 반영)</span></a>
      <div class="addr"><span data-url="/view"></span><button type="button" class="copy" data-copy="/view" aria-label="시간표 보기 주소 복사" title="주소 복사"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 4.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v7.5A1.5 1.5 0 0 0 4 13h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><em role="status"></em></div>
    </div>
    <div class="item">
      <a href="/dg"><b>대강 신청</b><span>결강 수업의 대강을 선착순으로 신청</span></a>
      <div class="addr"><span data-url="/dg"></span><button type="button" class="copy" data-copy="/dg" aria-label="대강 신청 주소 복사" title="주소 복사"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 4.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v7.5A1.5 1.5 0 0 0 4 13h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><em role="status"></em></div>
    </div>
    <div class="item">
      <a href="/winter"><b>교실 → 실습실 수업 장소 이동</b><span>빈 실습실을 골라 수업 장소 이동 신청</span></a>
      <div class="addr"><span data-url="/winter"></span><button type="button" class="copy" data-copy="/winter" aria-label="교실 → 실습실 수업 장소 이동 주소 복사" title="주소 복사"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 4.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v7.5A1.5 1.5 0 0 0 4 13h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><em role="status"></em></div>
    </div>
    <div class="item admin">
      <a href="/"><b>관리자 (교체 탐색기) · 비밀번호 필요</b></a>
      <div class="addr"><span data-url="/"></span><button type="button" class="copy" data-copy="/" aria-label="관리자 (교체 탐색기) · 비밀번호 필요 주소 복사" title="주소 복사"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M13 4.5V4a1.5 1.5 0 0 0-1.5-1.5H4A1.5 1.5 0 0 0 2.5 4v7.5A1.5 1.5 0 0 0 4 13h.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button><em role="status"></em></div>
    </div>
  </nav>
</main>
<script>
// 주소 복사: 메뉴마다 그 화면의 전체 주소를 보여 주고, 단추를 누르면 클립보드에 넣는다
const full = p => location.origin + p;
for (const s of document.querySelectorAll('.addr span')) s.textContent = full(s.dataset.url).replace(/^https?:\/\//, '');
document.querySelector('nav').addEventListener('click', async e => {
  const b = e.target.closest('button[data-copy]');
  if (!b) return;
  const url = full(b.dataset.copy), msg = b.parentNode.querySelector('em');
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true; }
  catch {   // 클립보드 권한이 없는 브라우저: 임시 입력 칸을 골라 복사
    const t = document.createElement('textarea'); t.value = url; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
    try { ok = document.execCommand('copy'); } catch {} t.remove();
  }
  msg.textContent = ok ? '복사했습니다' : '복사하지 못했습니다. 주소를 길게 눌러 복사해 주세요';
  setTimeout(() => { msg.textContent = ''; }, 2500);
});
</script>
</body>
</html>
