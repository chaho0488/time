<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대강 신청</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Malgun Gothic", sans-serif; background: #f0f2f8; color: #222; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; color: #5B3FA8; margin: 4px 0 12px; }
  .box { background: #fff; border-radius: 10px; padding: 12px 16px; margin-bottom: 12px; box-shadow: 0 1px 3px #0001; }
  .box ul { margin: 0; padding-left: 1.2em; line-height: 1.7; }
  label { font-weight: 600; }
  #me { font-size: 1.05rem; padding: 8px 10px; width: 12em; max-width: 60vw; border: 2px solid #5B3FA8; border-radius: 6px; }
  #msg { margin-top: 8px; min-height: 1.4em; font-weight: 600; }
  .ok { color: #1a7f37; } .err { color: #c62828; }
  .wrap { overflow-x: auto; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px #0001; }
  table { border-collapse: collapse; min-width: 900px; width: 100%; }
  th, td { border: 1px solid #d5d8e3; padding: 6px; text-align: center; font-size: .9rem; }
  thead th { background: #ece8f7; }
  th.t { position: sticky; left: 0; background: #ece8f7; z-index: 1; white-space: nowrap; }
  td.no { background: #eee; }
  td.open button { margin-top: 4px; padding: 6px 12px; font-size: .9rem; border: 0; border-radius: 6px; background: #5B3FA8; color: #fff; cursor: pointer; }
  td.done { background: #e6f4ea; }
  .cls { font-weight: 600; }
  .who { margin-top: 4px; font-weight: 700; color: #1a7f37; }
  .at { font-size: .75rem; color: #777; }
  .x { margin-top: 4px; font-size: .8rem; color: #c62828; background: none; border: 1px solid #c62828; border-radius: 4px; cursor: pointer; }
  .admin { margin-top: 16px; font-size: .85rem; color: #777; }
  .admin input { width: 9em; }
</style>
</head>
<body>
<main>
  <h1 id="title">대강 신청</h1>
  <div class="box">
    <ul>
      <li>아래 시간 수업의 대강을 <b>선착순</b>으로 받습니다.</li>
      <li>먼저 <b>본인 이름-과목</b>(예: 홍길동-수학)을 적고, 원하는 칸의 <b>[신청]</b>을 누르세요.</li>
      <li>먼저 저장된 신청만 인정되며, 이미 신청된 칸은 바꿀 수 없습니다.</li>
      <li>같은 교시에는 한 칸만 신청할 수 있습니다. 회색 칸은 수업이 없는 칸입니다.</li>
      <li>취소·변경은 담당 선생님께 말씀해 주세요.</li>
    </ul>
  </div>
  <div class="box">
    <label for="me">본인 이름-과목</label>
    <input id="me" placeholder="홍길동-수학" maxlength="26" autocomplete="off">
    <div id="msg"></div>
  </div>
  <div class="wrap"><table id="tbl"></table></div>
  <div class="admin">관리자 취소: <input id="pw" type="password" placeholder="비밀번호"> (입력하면 신청 칸에 취소 단추가 보입니다)</div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let data = null;

// 이름-과목은 이 기기에 기억해 두어 다시 열어도 그대로
try { $('me').value = localStorage.getItem('dgMe') || ''; } catch {}
$('me').addEventListener('input', () => { try { localStorage.setItem('dgMe', $('me').value); } catch {} });
$('pw').addEventListener('input', render);

function say(text, ok) { $('msg').textContent = text; $('msg').className = ok ? 'ok' : 'err'; }

async function load() {
  try {
    const r = await fetch('/api/dg', { cache: 'no-store' });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    data = await r.json();
    render();
  } catch (e) { say('표를 불러오지 못했습니다: ' + e.message); }
}

function render() {
  if (!data) return;
  $('title').textContent = data.title;
  document.title = data.title;
  const got = Object.fromEntries(data.signups.map(s => [s.slot, s]));
  const admin = $('pw').value !== '';
  let h = '<thead><tr><th class="t">교사</th>' + data.cols.map(([, name]) => `<th>${esc(name).replace(') ', ')<br>')}</th>`).join('') + '</tr></thead><tbody>';
  for (const [t, cls] of data.rows) {
    h += `<tr><th class="t">${esc(t)}</th>`;
    for (const [col] of data.cols) {
      const slot = `${col}|${t}`, s = got[slot];
      if (!cls[col]) h += '<td class="no"></td>';
      else if (s) h += `<td class="done"><div class="cls">${esc(cls[col])}</div><div class="who">${esc(s.label)}</div><div class="at">${esc(s.at)}</div>`
        + (admin ? `<button class="x" data-del="${esc(slot)}">취소</button>` : '') + '</td>';
      else h += `<td class="open"><div class="cls">${esc(cls[col])}</div><button data-slot="${esc(slot)}">신청</button></td>`;
    }
    h += '</tr>';
  }
  $('tbl').innerHTML = h + '</tbody>';
}

$('tbl').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.slot) {
    const me = $('me').value.trim();
    if (!/^[^-]+-[^-]+$/.test(me)) { say('먼저 위 칸에 "이름-과목"을 적어 주세요 (예: 홍길동-수학)'); $('me').focus(); return; }
    const [col, t] = b.dataset.slot.split('|');
    const colName = data.cols.find(c => c[0] === col)[1];
    const cls = data.rows.find(r => r[0] === t)[1][col];
    if (!confirm(`${colName} ${t} 선생님 ${cls}\n→ ${me} (으)로 신청할까요?`)) return;
    b.disabled = true;
    const r = await fetch('/api/dg', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ slot: b.dataset.slot, label: me }) })
      .then(r => r.json()).catch(() => ({ error: '인터넷 연결을 확인해 주세요' }));
    say(r.ok ? `신청되었습니다: ${colName} ${t} 선생님 ${cls} → ${r.label}` : r.error, r.ok);
  } else if (b.dataset.del) {
    if (!confirm('이 신청을 취소할까요?')) return;
    const r = await fetch('/api/dg?slot=' + encodeURIComponent(b.dataset.del), { method: 'DELETE', headers: { 'X-Pw': $('pw').value } })
      .then(r => r.json()).catch(() => ({ error: '인터넷 연결을 확인해 주세요' }));
    say(r.ok ? '취소했습니다' : r.error, r.ok);
  }
  load();
});

load();
setInterval(load, 20000);   // 다른 선생님 신청이 20초마다 보이도록
</script>
</body>
</html>
