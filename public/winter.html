<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한파 수업 장소 이동 신청</title>
<!-- 글꼴(Pretendard): 불러오지 못하면 기기 기본 글꼴로 보인다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 색: 차가운 남색 바탕에, 쓸 수 있는 따뜻한 실만 호박색으로 — 화면에서 '따뜻한 실'이 먼저 눈에 들어오게 */
  :root { --ink: #14213D; --sub: #5A6478; --paper: #F3F6FA; --card: #FFFFFF; --line: #D9E0EA;
          --warm: #F2A93B; --warm-bg: #FFF2D9; --warm-ink: #7A4E00; --pine: #1F7A5C; --pine-bg: #DDF1E8;
          --frost: #E4E9F0; --frost-ink: #8B95A5; --red: #C0392B; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; background: var(--paper); color: var(--ink); line-height: 1.5; -webkit-font-smoothing: antialiased; }
  main { max-width: 880px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; margin: 0; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h2 { font-size: 1.2rem; font-weight: 800; letter-spacing: -.01em; margin: 40px 0 12px; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
  .ok { color: var(--pine); } .err { color: var(--red); }

  /* 신청: 1 이름 → 2 수업 → 3 시작일 */
  .apply { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 20px 20px; }
  .step { padding: 16px 0; border-bottom: 1px solid var(--line); }
  .apply > .step:first-child:has(+ #steps[hidden]) { border-bottom: 0; padding-bottom: 6px; }   /* 이름을 고르기 전: 교사명 칸만 */
  #msg:empty { display: none; }
  .step > label { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
  .num { flex: none; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--ink); color: #fff; font-size: .85rem; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  #teacher, #from { font-size: 1.05rem; padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; width: 100%; max-width: 17em; }
  .pick { position: relative; max-width: 17em; }
  #tlist { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 5; background: #fff; border: 1.5px solid var(--ink); border-radius: 8px; max-height: 15em; overflow-y: auto; }
  #tlist button { display: block; width: 100%; text-align: left; padding: 11px 12px; font-size: 1.05rem; border: 0; border-bottom: 1px solid var(--line); background: #fff; cursor: pointer; }
  #tlist button:last-child { border-bottom: 0; }
  #tlist button:hover, #tlist button:focus { background: var(--warm-bg); }
  .hint { font-size: .9rem; color: var(--sub); }
  #from { width: auto; }
  .fromrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #fromNote { font-size: .9rem; font-weight: 700; color: var(--warm-ink); background: var(--warm-bg); border-radius: 6px; padding: 4px 10px; }
  #fromNote:empty { display: none; }
  #send { margin-top: 18px; padding: 12px 34px; font-size: 1.05rem; font-weight: 700; border: 0; border-radius: 8px; background: var(--ink); color: #fff; cursor: pointer; }
  #send:disabled { opacity: .5; }
  #msg { margin-top: 10px; font-weight: 700; }

  /* 내 시간표: 옮기고 싶은 수업 칸을 눌러 고른다 */
  .wrap { overflow-x: auto; }
  #mytt table { border-collapse: separate; border-spacing: 4px; width: 100%; table-layout: fixed; margin: 8px -4px 0; }
  #mytt th { font-size: .9rem; font-weight: 700; color: var(--sub); padding: 2px 0; }
  #mytt th.p { width: 1.8em; }
  #mytt td { padding: 0; height: 3.3em; border-radius: 6px; text-align: center; font-weight: 700; font-size: .95rem; background: transparent; }
  #mytt td small, #mytt td button small { display: block; font-weight: 500; font-size: .78rem; color: var(--sub); }
  #mytt td button { width: 100%; height: 100%; min-height: 3.3em; border: 1.5px solid var(--line); border-radius: 6px; background: #fff; font-weight: 700; cursor: pointer; padding: 2px; }
  #mytt td button:hover { border-color: var(--ink); }
  #mytt td button.sel { background: var(--ink); border-color: var(--ink); color: #fff; }
  #mytt td button.sel small { color: #C9D3E6; }
  #mytt .all { margin-top: 8px; padding: 8px 14px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; }
  #mytt td.lab { background: var(--frost); color: var(--frost-ink); }            /* 이미 실습실에서 하는 수업 */
  #mytt td.lab small { color: var(--frost-ink); }
  #mytt td.req { background: var(--pine-bg); color: var(--pine); }                /* 이미 신청한 수업 */
  #mytt td.req small { color: var(--pine); }
  #mytt td.out { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }

  /* 실습실 시간표: 실 이름을 한 줄 크게 쓰고, 그 아래 1~7교시를 한 줄로 */
  .nav { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .nav button { width: 2.6em; height: 2.6em; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; cursor: pointer; font-size: 1rem; }
  .nav input { font-size: 1.05rem; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; }
  #vday { font-size: 1.2rem; font-weight: 800; margin-left: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .85rem; color: var(--sub); margin: 12px 0 4px; }
  .legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; border-radius: 3px; margin-right: 5px; vertical-align: -1px; background: var(--c); border: 1px solid var(--line); }
  .fine { font-size: .82rem; color: var(--sub); margin: 0 0 12px; }
  #note { font-weight: 700; margin-bottom: 8px; }
  #grid { display: block; }
  /* 같은 층의 실은 표 하나로 묶는다: 바깥 테두리 하나, 실 사이는 가는 줄 */
  .ftable { background: var(--card); border: 1.5px solid var(--ink); border-radius: 12px; overflow: hidden; }
  /* 층별 묶음 제목 */
  .floor { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 800; margin: 22px 0 8px; }
  .floor:first-child { margin-top: 4px; }
  .floor span { font-size: .82rem; font-weight: 700; color: var(--warm-ink); background: var(--warm-bg); border-radius: 999px; padding: 2px 10px; }
  .tabs { display: inline-flex; margin: 12px 0 0; border: 1.5px solid var(--ink); border-radius: 8px; overflow: hidden; }
  .tabs button { padding: 8px 18px; border: 0; background: #fff; font-weight: 700; cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--ink); color: #fff; }
  /* 층별 배치도 */
  .pname { font-size: .85rem; font-weight: 700; color: var(--sub); margin: 8px 0 4px; }
  /* 글자·칸 높이는 배치도 너비에 비례(cqw): 화면이 넓으면 글자도 커지고, 좁아도 최소 크기는 지킨다 */
  .plan { container-type: inline-size; display: flex; border: 1.5px solid var(--ink); border-radius: 10px; overflow: hidden; background: #fff; margin-bottom: 8px; }
  .pcol { display: flex; flex-direction: column; min-width: 0; }
  .pside { display: flex; min-width: 0; }
  .pside > .pc { flex: 1 1 auto !important; }
  .prow { display: flex; height: clamp(104px, 21cqw, 190px); }
  .pmid { height: clamp(20px, 3.6cqw, 32px); padding: 0 8px; font-size: clamp(11px, 1.9cqw, 16px); color: var(--sub); background: #fff; display: flex; align-items: center; white-space: nowrap; overflow: hidden; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .pc { min-width: 0; margin: 0; padding: 3px 1px; border: 0; border-right: 1px solid var(--line); border-radius: 0; background: repeating-linear-gradient(135deg, #F6F8FB 0 6px, #EDF1F6 6px 7px); color: var(--frost-ink);
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow: hidden; font: inherit; line-height: 1.2; }
  .prow > .pc:last-child, .pside:last-child > .pc { border-right: 0; }
  .pc span { font-size: clamp(11px, 1.7cqw, 15px); overflow-wrap: anywhere; }
  .pr { min-width: clamp(50px, 9cqw, 80px); }   /* 실습실 칸은 너무 좁아지지 않게(옆의 계단·화장실 칸이 대신 줄어든다) */
  .pr span:not(.pcmark) { font-size: clamp(12px, 2.5cqw, 21px); font-weight: 600; letter-spacing: -.03em; }
  .pc b { font-size: clamp(15px, 3.3cqw, 28px); font-weight: 800; }
  .pc em { font-style: normal; font-size: clamp(11.5px, 2.3cqw, 19px); font-weight: 700; white-space: nowrap; }
  .pcmark { display: inline-block; font-size: clamp(11px, 1.9cqw, 16px); font-weight: 800; line-height: 1.3; padding: 0 4px; border: 1.5px solid currentColor; border-radius: 4px; white-space: nowrap; }
  .pr .pcmark { margin: 1px 0; }
  .room header .pcmark, .fine .pcmark { font-size: .72rem; }
  .pr { cursor: pointer; }
  .pr.on { background: var(--warm-bg); color: var(--warm-ink); box-shadow: inset 0 0 0 2px var(--warm); }
  .pr.on b { color: var(--ink); }
  .pr.off { background: var(--frost); color: var(--frost-ink); }
  .pr.never { background: #B4BCC9; color: #4E5766; }
  .pr:disabled { cursor: default; }
  .pr[aria-pressed=true] { box-shadow: inset 0 0 0 3px var(--ink); }
  .ftable { margin-bottom: 8px; }
  /* 신청 내역: 교사·과목·학반 요약, 정렬, 골라서 한 번에 취소 */
  .bulk { padding: 10px 8px 0; text-align: right; }
  #bulkDel { padding: 7px 12px; border: 1.5px solid var(--red); border-radius: 8px; background: #fff; color: var(--red); font-weight: 700; cursor: pointer; }
  #bulkDel:disabled { border-color: var(--line); color: var(--frost-ink); cursor: default; }
  #list .ck { width: 2em; text-align: center; }
  #list .ck input { width: 1.2em; height: 1.2em; accent-color: var(--ink); }
  #list .sort { border: 0; background: none; padding: 0; font: inherit; font-weight: 700; color: inherit; cursor: pointer; }
  #list table.sum > tbody > tr.g > td { font-size: 1rem; }
  #list tr.d > td { padding: 0 8px 8px; background: var(--paper); }
  #list tr.d table { background: #fff; border: 1px solid var(--line); border-radius: 8px; }
  #list .more { text-decoration: underline; color: var(--sub); }
  .more { margin-left: auto; font-size: .82rem; font-weight: 700; color: var(--frost-ink); background: none; border: 0; padding: 4px 2px; cursor: pointer; text-decoration: underline; }
  .room { background: var(--card); border-bottom: 1px solid var(--line); padding: 12px 14px 14px; }
  .room:last-child { border-bottom: 0; }
  .room.open { box-shadow: inset 5px 0 0 var(--warm); }   /* 이용가능 실: 왼쪽 호박색 띠 */
  .room header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .room header input { width: 1.25em; height: 1.25em; margin: 0; accent-color: var(--ink); }
  .code { font-size: .95rem; font-weight: 800; background: var(--ink); color: #fff; border-radius: 6px; padding: 2px 8px; }
  .rname { font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; }
  .badge { font-size: .82rem; font-weight: 700; color: var(--ink); background: var(--warm); border-radius: 999px; padding: 2px 10px; }
  .shutlab { font-size: .82rem; font-weight: 700; color: var(--frost-ink); border: 1.5px solid var(--frost-ink); border-radius: 999px; padding: 1px 9px; }
  .strip { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .strip li { position: relative; min-height: 3.6em; border-radius: 6px; padding: 14px 2px 4px; text-align: center; background: var(--paper); overflow-wrap: anywhere; }
  .strip li i { position: absolute; top: 2px; left: 5px; font-style: normal; font-size: .68rem; font-weight: 700; color: var(--frost-ink); }
  .strip li b { display: block; font-size: .88rem; line-height: 1.25; }
  .strip li small { display: block; font-size: .72rem; color: var(--sub); line-height: 1.25; }
  .strip li.busy { background: #E9EEF5; }                                          /* 전공 수업 */
  .strip li.free { background: var(--warm-bg); color: var(--warm-ink); }           /* 이용가능 실의 빈 시간 */
  .strip li.free i { color: var(--warm-ink); }
  .strip li.done { background: var(--pine-bg); color: var(--pine); box-shadow: inset 0 0 0 2px var(--pine); }   /* 배정된 수업 */
  .strip li.done small { color: var(--pine); }
  .strip li.out { background: repeating-linear-gradient(135deg, transparent 0 5px, var(--line) 5px 6px); }       /* 그 요일에 없는 교시 */
  /* 수업 불가 실: 줄 전체를 회색으로 닫고 낮게 */
  .room.closed { background: var(--frost); border-bottom-color: #CFD6E0; padding: 9px 14px 10px; }
  .room.closed header { margin-bottom: 0; }
  .room.closed .strip { margin-top: 8px; }
  .room.closed .code { background: var(--frost-ink); }
  .room.closed .rname { color: var(--frost-ink); font-size: 1rem; }
  .room.closed .strip li { background: #D8DEE7; min-height: 2.9em; color: var(--frost-ink); }
  .room.closed .strip li small { color: var(--frost-ink); }
  /* 교실 이용불가 실습실(현황표 X): 더 어두운 음영 */
  .room.never { background: #B4BCC9; border-bottom-color: #A3ACBA; }
  .room.never .code { background: #5E6878; }
  .room.never .rname, .room.never .more { color: #4E5766; }
  .room.never .shutlab { color: #4E5766; border-color: #4E5766; }
  .room.never .strip li { background: #C9D0DA; color: #4E5766; }
  .room.never .strip li small, .room.never .strip li i { color: #5E6878; }

  /* 신청 내역 */
  #list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  #list table { border-collapse: collapse; width: 100%; }
  #list th { font-size: .82rem; font-weight: 700; color: var(--sub); text-align: left; padding: 10px 8px; border-bottom: 1.5px solid var(--ink); white-space: nowrap; }
  #list td { padding: 10px 8px; border-bottom: 1px solid var(--line); font-size: .95rem; white-space: nowrap; }
  #list tr:last-child td { border-bottom: 0; }
  #list td.l { white-space: normal; }
  #list select { padding: 7px 8px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; max-width: 12em; }
  #list .empty { padding: 18px; color: var(--sub); }
  .x { font-size: .85rem; font-weight: 700; color: var(--red); background: none; border: 1.5px solid var(--red); border-radius: 6px; cursor: pointer; padding: 3px 9px; }
  .wait { color: var(--warm-ink); font-weight: 700; }
  .admin { font-size: .9rem; margin: 0; }
  .admin span { display: inline-flex; align-items: center; gap: 6px; }
  .admin span[hidden] { display: none; }   /* 위 display 가 hidden 을 덮어쓰지 않게 */
  .admin input { width: 9.5em; padding: 7px 9px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; }
  .admin button { padding: 7px 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; white-space: nowrap; }
  #login { background: var(--ink); color: #fff; }
  #adminMsg { font-size: .85rem; font-weight: 700; margin-top: 4px; }
  #adminMsg:empty { display: none; }
  #adminHint { margin: -8px 0 16px; }
  /* 관리자: 빈 실 칸을 누르면 그 시간에 기다리는 신청을 골라 배정 */
  .strip li button { display: block; width: 100%; min-height: 2.2em; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; }
  .strip li.free:has(button) { box-shadow: inset 0 0 0 1.5px var(--warm); }
  .strip li.free:has(button[aria-expanded=true]) { box-shadow: inset 0 0 0 2.5px var(--ink); }
  .strip li.free small { color: var(--warm-ink); font-weight: 700; }
  .putbox { margin-top: 10px; padding: 10px 12px; background: var(--warm-bg); border-radius: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .putbox button[data-put]:not(.x) { padding: 8px 12px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; font-weight: 700; cursor: pointer; }
  .putbox button small { font-weight: 500; color: var(--sub); }
  @media (max-width: 600px) {
    .pc:not(.pr) span { display: none; }   /* 폰: 실습실이 아닌 칸의 이름만 숨김(실습실은 줄인 이름이 나옴) */
    main { padding: 20px 12px 40px; }
    h1 { font-size: 1.35rem; }
    .apply { padding: 2px 14px 16px; }
    .room { padding: 10px 10px 12px; }
    .strip { gap: 3px; }
    .strip li b { font-size: .8rem; } .strip li small { font-size: .66rem; }
    #mytt td { font-size: .85rem; } #mytt td small, #mytt td button small { font-size: .7rem; }
    #list th, #list td { padding: 8px 3px; font-size: .78rem; white-space: normal; word-break: keep-all; }
    #list select { max-width: 8.5em; padding: 5px 4px; }
  }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>한파 관련 수업 장소 이동 신청</h1>
    <form class="admin" id="adminForm">
      <span id="adminIn"><input id="pw" type="password" placeholder="관리자 비밀번호" autocomplete="off" aria-label="관리자 비밀번호"><button id="login">관리자 로그인</button></span>
      <span id="adminOn" hidden><b class="ok">관리자 로그인됨</b><button type="button" id="logout">로그아웃</button></span>
      <div id="adminMsg" class="err" role="alert"></div>
    </form>
  </div>
  <p id="adminHint" class="fine" hidden>관리자 화면입니다. 실습실 시간표의 노란 "빈 실" 칸을 누르면 그 시간에 기다리는 신청을 골라 배정할 수 있습니다. 실 이름 앞 체크는 보고 있는 날짜부터 이용가능으로 표시합니다.</p>

  <div class="apply">
    <div class="step">
      <label for="teacher"><span class="num">1</span>교사명</label>
      <div class="pick">
        <input id="teacher" type="text" placeholder="이름 또는 초성 (예: ㅎㄱㄷ)" maxlength="10" autocomplete="off" aria-autocomplete="list" aria-controls="tlist">
        <div id="tlist" hidden></div>
      </div>
      <div class="hint" id="nameHint" style="margin-top:6px">이름을 고르면 옮길 수업을 고르는 시간표가 나옵니다.</div>
    </div>
    <div id="steps" hidden>
      <div class="step">
        <label><span class="num">2</span>옮기고 싶은 수업</label>
        <div id="mytt"></div>
      </div>
      <div class="step" style="border-bottom:0;padding-bottom:0">
        <label for="from"><span class="num">3</span>언제부터 이동을 희망하십니까</label>
        <div class="fromrow"><input id="from" type="date"><span id="fromNote"></span></div>
      </div>
      <button id="send">신청</button>
    </div>
    <div id="msg"></div>
  </div>

  <h2>실습실 시간표</h2>
  <div class="nav">
    <button id="prev" aria-label="전날">◀</button>
    <input id="vdate" type="date" aria-label="볼 날짜">
    <button id="next" aria-label="다음날">▶</button>
    <b id="vday"></b>
  </div>
  <div class="tabs" role="tablist" aria-label="실습실 시간표 보기"><button type="button" role="tab" id="tabPlan">배치도형</button><button type="button" role="tab" id="tabTable">목록형</button></div>
  <div class="legend"><span style="--c:#FFF2D9">빈 실(이용가능)</span><span style="--c:#DDF1E8">배정된 수업</span><span style="--c:#E9EEF5">전공 수업</span><span style="--c:#D8DEE7">수업 불가 실</span><span style="--c:#B4BCC9">교실 이용불가</span></div>
  <p class="fine">확정 시간표 기준이며 교체·대강으로 옮겨진 수업은 반영되지 않습니다.</p>
  <div id="note" class="err"></div>
  <div id="grid"></div>

  <h2>신청 내역</h2>
  <div class="wrap" id="list"></div>

</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DAYS = ['월', '화', '수', '목', '금'], NP = { 월: 6, 화: 7, 수: 7, 목: 7, 금: 5 };   // 요일별 교시 수
let data = null, me = '';          // me = 고른 교사
let openCell = '';                 // 관리자가 누른 빈 실 칸('실|요일교시')
let view = 'plan';                 // 실습실 시간표 보기: 'plan'(배치도형, 기본) | 'table'(목록형)
try { if (localStorage.getItem('winterView') === 'table') view = 'table'; } catch {}
const shown = new Set();           // 층별 표에서 시간표를 펼쳐 둔 수업 불가 실
let sel = '';                      // 배치도에서 누른 실(그 실의 시간표를 배치도 아래에 보여 준다)
let openReq = '';                  // 신청 내역에서 '자세히'를 펼친 줄('교사|과목')
let sortBy = 'teacher', sortDir = 1;   // 신청 내역 정렬: 교사·과목·학반, 오름(1)/내림(-1)
const picks = new Set();           // 신청 내역에서 한 번에 취소하려고 고른 줄('교사|과목')
// 배치도 칸에 쓰는 줄인 실 이름(좁은 화면에서도 보이게)
const SHORT = { '1A': '공유압1', '1B': '내선공사1', '1C': '내선공사2', '1D': '설비보전', '2A': '공유압2', '2B': '동력설비', '2C': '반도체', '2D': '송변전', '2E': '자동제어', '2F': '전기기기', '2G': 'CAD1', '2X': '생산자동화1', '2Y': '생산자동화2',
  '3A': '신재생', '3B': '제어기기', '3C': '자동화설비', '3D': '전기저장', '3E': '전자회로', '3F': 'CAD2', '4A': '기계제어', '4B': '전기설비1', '4C': '전기설비2', '4D': '환경공정' };
const PCMARK = '<span class="pcmark" title="PC 사용가능">PC</span>';   // PC 사용가능 실 표시
// 층별 배치도(학교 배치도.hwpx 의 실습동 표 그대로): 칸 = [이름, 너비, 실 코드]. 실 코드가 있는 칸만 실습실.
// top·bottom = 복도 위·아래 줄, left·right = 위아래를 다 차지하는 양옆 칸, mid = 복도에 적는 글
const PLAN = {
  1: [{ top: [['매점', 5043], ['화장실', 3200], ['계단', 3989], ['', 10328, '1A'], ['', 9762, '1C'], ['계단', 4092]], mid: '← 교실동 이동 통로 · 복도',
        bottom: [['휴게실', 8243], ['현관', 3989], ['', 16074, '1D'], ['준비실', 4016], ['현관', 4092]], right: ['', 11487, '1B'] }],
  2: [{ name: '실습동 1', top: [['학과사무실', 4919], ['화장실', 3431], ['계단', 3939], ['', 7879, '2E'], ['', 8162, '2A'], ['VR실', 3926], ['계단', 4177], ['', 5386, '2G'], ['', 4997, '2F']], mid: '← 교실동 이동 통로 · 복도',
        bottom: [['', 8350], ['전공전학공실', 11818], ['', 16265, '2B'], ['', 5386, '2C'], ['', 4997, '2D']] },
      { name: '실습동 2(별관)', mid: '복도', bottom: [['', 8508, '2Y'], ['', 8791, '2X'], ['계단', 3653]], right: ['프로젝트제작실', 14263] }],
  3: [{ top: [['자동화 동아리실', 4946], ['화장실', 3395], ['계단', 3788], ['', 10144, '3F'], ['', 10144, '3E'], ['계단', 3922], ['', 11844, '3C']], mid: '← 교실동 이동 통로 · 복도',
        bottom: [['기자재실', 8341], ['', 11655, '3A'], ['', 8254, '3D'], ['프로젝트 공작실', 4167], ['3D동아리실', 3922], ['', 6068, '3B'], ['프로젝트실습실', 5776]] }],
  4: [{ left: ['전공심화 동아리실', 5043], top: [['화장실', 3179], ['계단', 4010], ['', 10043, '4B'], ['', 10043, '4A'], ['계단', 4156]], mid: '복도',
        bottom: [['', 3179], ['', 11765, '4C'], ['', 12331, '4D'], ['약품실', 4156]], right: ['체력단련실', 11709] }],
};
const picked = new Set();          // 내 시간표에서 고른 칸(요일교시)

// 이 기기 표시: 내 신청(취소 단추)을 알아보는 데 쓴다. 대강 신청(/dg)과 같은 값을 쓴다
let DEV = '';
try { DEV = localStorage.getItem('dgDev') || ''; if (!DEV) { DEV = crypto.randomUUID(); localStorage.setItem('dgDev', DEV); } } catch {}
// 관리자 비밀번호: '관리자 로그인'을 눌러 서버가 맞다고 한 값만 쓴다. 이 탭을 닫을 때까지 기억
let PW = '';
try { PW = sessionStorage.getItem('winterPw') || ''; } catch {}
const H = (extra = {}) => ({ 'X-Dev': DEV, 'X-Pw': PW, ...extra });

function say(text, ok) { $('msg').textContent = text; $('msg').className = ok ? 'ok' : 'err'; }
const dayOf = iso => { const d = new Date(iso + 'T00:00:00Z'); return isNaN(d) ? '' : '일월화수목금토'[d.getUTCDay()]; };
const md = iso => `${Number(iso.slice(5, 7))}/${Number(iso.slice(8, 10))}(${dayOf(iso)})`;
function addDays(iso, n) {   // 주말은 건너뛴다
  let d = new Date(iso + 'T00:00:00Z');
  do { d = new Date(d.getTime() + n * 864e5); } while ([0, 6].includes(d.getUTCDay()));
  return d.toISOString().slice(0, 10);
}
const minDate = () => (data.start > data.today ? data.start : data.today);
const roomName = code => (data.rooms.find(r => r[0] === code) || ['', ''])[1].replace('실습실', '');
const slotOrder = k => DAYS.indexOf(k[0]) * 10 + Number(k[1]);
// 이용가능 실은 이용 시작일부터만 이용가능
const availOn = (room, iso) => typeof data.avail[room] === 'string' && iso >= data.avail[room];
// 배정된 수업이 실제로 그 실에서 시작되는 날: 신청 시작일과 실의 이용 시작일 중 늦은 날
const startOf = r => (data.avail[r.room] && data.avail[r.room] > r.from ? data.avail[r.room] : r.from);
// 그 날짜의 p교시가 원래 시간표의 어느 칸인지 (교시가 옮겨진 날은 원래 교시로)
function slotAt(iso, p) { const sh = data.shift[iso], bp = sh ? sh[p] : p; return bp ? dayOf(iso) + bp : null; }
// 배정할 수 있는 실: 이용가능 표시가 있고, 그 요일교시에 전공 수업도 다른 배정도 없는 실 (서버와 같은 규칙)
const freeRooms = slot => data.rooms.map(r => r[0]).filter(c => typeof data.avail[c] === 'string' && !(data.base[c] && data.base[c][slot]) && !data.reqs.some(r => r.room === c && r.slot === slot));
const roomLabel = (r, c) => `${c} ${esc(roomName(c))}` + (data.avail[c] && data.avail[c] > r.from ? ` (${md(data.avail[c])}부터)` : '');

// ── 교사 이름 찾기: 이름 일부나 초성(ㅎㄱㄷ), 쓰는 도중의 글자(홍기 → 홍길동)로도 찾는다 ──
const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const syl = ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c < 11172 ? c : -1; };
function charHit(q, n) {
  if (q === n) return true;
  const sn = syl(n), sq = syl(q);
  if (sn < 0) return false;
  if (CHO.includes(q)) return CHO[Math.floor(sn / 588)] === q;                    // 초성만
  return sq >= 0 && sq % 28 === 0 && Math.floor(sq / 28) === Math.floor(sn / 28);   // 받침을 아직 안 쓴 글자
}
const nameHit = (q, name) => { for (let i = 0; i + q.length <= name.length; i++) if ([...q].every((ch, j) => charHit(ch, name[i + j]))) return true; return false; };
function showNames() {
  const q = $('teacher').value.replace(/\s+/g, '');
  const names = data && q ? Object.keys(data.tt).filter(n => nameHit(q, n)).sort((a, b) => a.localeCompare(b, 'ko')) : [];
  $('tlist').hidden = !names.length || (names.length === 1 && names[0] === me && q === me);
  $('tlist').innerHTML = names.map(n => `<button type="button" data-name="${esc(n)}">${esc(n)}</button>`).join('');
}
function choose(name) {
  me = name; picked.clear();
  $('teacher').value = name; $('tlist').hidden = true;
  renderMine();
}
$('teacher').addEventListener('input', () => { if ($('teacher').value.trim() !== me) { me = ''; picked.clear(); renderMine(); } showNames(); });
$('teacher').addEventListener('focus', showNames);
$('teacher').addEventListener('keydown', e => { if (e.key === 'Enter') { const b = $('tlist').querySelector('button'); if (b && !$('tlist').hidden) choose(b.dataset.name); } });
$('tlist').addEventListener('click', e => { const b = e.target.closest('button[data-name]'); if (b) choose(b.dataset.name); });
document.addEventListener('click', e => { if (!e.target.closest('.pick')) $('tlist').hidden = true; });

// ── 내 시간표: 수업 칸을 눌러 옮기고 싶은 수업을 고른다 ──
function renderMine() {
  $('steps').hidden = !me; $('nameHint').hidden = !!me;   // 이름을 고른 뒤에만 수업 고르기·시작일·신청이 나온다
  if (!data || !me) { $('mytt').innerHTML = '<div class="hint">이름을 고르면 선생님 시간표가 나옵니다.</div>'; return; }
  const sc = data.tt[me];
  let h = '<div class="hint">수업 칸을 눌러 고르세요 (여러 칸 가능). 회색은 이미 실습실에서 하는 수업, 초록색은 이미 신청한 수업입니다.</div>'
    + '<button type="button" id="pickAll" class="all"></button>'
    + '<div class="wrap"><table><thead><tr><th class="p"></th>' + DAYS.map(d => `<th>${d}</th>`).join('') + '</tr></thead><tbody>';
  for (let p = 1; p <= 7; p++) {
    h += `<tr><th class="p">${p}</th>`;
    for (const d of DAYS) {
      const k = d + p, v = sc[k];
      if (p > NP[d]) { h += '<td class="out"></td>'; continue; }
      if (!v) { h += '<td></td>'; continue; }
      const [c, s, room] = v.split('|'), r = data.reqs.find(x => x.teacher === me && x.slot === k);
      if (room) h += `<td class="lab">${esc(c)}<small>${esc(s)} · ${esc(room)}</small></td>`;
      else if (r) h += `<td class="req">${esc(c)}<small>${r.room ? esc(r.room) + ' 배정' : '신청됨'}</small></td>`;
      else h += `<td><button type="button" data-slot="${k}" aria-pressed="${picked.has(k)}"${picked.has(k) ? ' class="sel"' : ''}>${esc(c)}<small>${esc(s)}</small></button></td>`;
    }
    h += '</tr>';
  }
  $('mytt').innerHTML = h + '</tbody></table></div>';
  syncAll();
}
// 전체 선택 단추: 고를 수 있는 칸이 모두 골라져 있으면 '전체 해제'로 바뀌고, 고를 칸이 없으면 숨긴다
const pickable = () => [...document.querySelectorAll('#mytt button[data-slot]')];
function syncAll() {
  const a = $('pickAll'), bs = pickable();
  if (!a) return;
  a.hidden = !bs.length;
  a.textContent = bs.length && bs.every(b => picked.has(b.dataset.slot)) ? '전체 해제' : `전체 선택 (${bs.length}칸)`;
}
$('mytt').addEventListener('click', e => {
  if (e.target.closest('#pickAll')) {   // 한 번에 전부 고르기/풀기
    const bs = pickable(), on = !bs.every(b => picked.has(b.dataset.slot));
    for (const b of bs) { if (on) picked.add(b.dataset.slot); else picked.delete(b.dataset.slot); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); }
    syncAll(); return;
  }
  const b = e.target.closest('button[data-slot]');
  if (!b) return;
  const k = b.dataset.slot;
  if (picked.has(k)) picked.delete(k); else picked.add(k);
  b.classList.toggle('sel', picked.has(k)); b.setAttribute('aria-pressed', picked.has(k));
  syncAll();
});

async function load() {
  try {
    const r = await fetch('/api/winter', { cache: 'no-store', headers: H() });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const first = !data;
    data = await r.json();
    if (first) {
      // 이동 시작일(11/25) 앞 날짜는 고를 수도 볼 수도 없다. 기본값은 그날(지났으면 오늘, 주말이면 다음 월요일)
      const m = minDate(), d0 = [0, 6].includes(new Date(m + 'T00:00:00Z').getUTCDay()) ? addDays(m, 1) : m;
      $('vdate').value = d0; $('vdate').min = m; $('from').value = d0; $('from').min = m;
      try { localStorage.removeItem('winterTeacher'); } catch {}   // 예전에 기억해 둔 이름은 지움(접속할 때 이름을 미리 채우지 않음)
      renderMine();
    } else renderMine();
    // 시작일 옆 안내: 이용가능 실 중 가장 빠른 이용 시작일 (예: '11/25부터 일부 실습실 이용가능')
    const d1 = Object.values(data.avail).sort()[0];
    $('fromNote').textContent = d1 ? `${md(d1).split('(')[0]}부터 일부 실습실 이용가능` : '';
    if (document.activeElement && document.activeElement.tagName === 'SELECT' && document.activeElement.closest('#list')) return;   // 배정 실을 고르는 중이면 다시 그리지 않음
    render();
  } catch (e) { say('불러오지 못했습니다: ' + e.message); }
}

function render() {
  if (!data) return;
  const iso = $('vdate').value, day = dayOf(iso), n = NP[day] || 0, admin = !!data.admin;
  $('adminIn').hidden = admin; $('adminOn').hidden = !admin;
  $('vday').textContent = iso ? md(iso) : '';
  $('adminHint').hidden = !admin; if (!admin) openCell = '';
  $('note').textContent = data.shift[iso] ? '⚠ 교시가 옮겨진 날입니다. 수업은 옮겨진 교시로 표시했습니다.' : '';

  // 실습실 시간표: 두 가지 보기(탭). '배치도형'(기본) = 층마다 배치도 그림(4층 → 1층), '목록형' = 층마다 표 하나(수업 불가 실은 한 줄로 접힘)
  $('tabTable').setAttribute('aria-selected', view !== 'plan'); $('tabPlan').setAttribute('aria-selected', view === 'plan');
  let h = '';
  if (!n) h = '<div class="hint">수업이 없는 날입니다.</div>';
  else if (view === 'plan') {   // 배치도: 이용가능 실만 누를 수 있고(관리자는 모든 실), 누른 실의 시간표가 배치도 아래에 나온다
    h = '<p class="fine">호박색(이용가능) 실을 누르면 그 실의 시간표가 아래에 나옵니다. 숫자는 그날 비어 있는 교시 수, ' + PCMARK + ' 는 PC 사용가능 실입니다.</p>';
    for (const f of ['4', '3', '2', '1']) {   // 건물처럼 위층부터
      const cnt = data.rooms.filter(r => r[0][0] === f && availOn(r[0], iso)).length;
      h += `<h3 class="floor">${f}층${cnt ? `<span>이용가능 ${cnt}곳</span>` : ''}</h3>`;
      for (const pl of PLAN[f]) h += (pl.name ? `<div class="pname">${pl.name}</div>` : '') + planHtml(pl, iso, n, admin);
      if (sel && sel[0] === f) h += `<div class="ftable">${roomHtml(sel, iso, n, admin, true)}</div>`;
    }
  } else {   // 목록형
    let floor = '';
    for (const [code] of data.rooms) {   // 실 코드 순 = 층 순
      if (code[0] !== floor) {
        floor = code[0];
        const cnt = data.rooms.filter(r => r[0][0] === floor && availOn(r[0], iso)).length;
        h += `${h ? '</div>' : ''}<h3 class="floor">${floor}층${cnt ? `<span>이용가능 ${cnt}곳</span>` : ''}</h3><div class="ftable">`;
      }
      h += roomHtml(code, iso, n, admin, false);
    }
    h += '</div>';
  }
  $('grid').innerHTML = h;

  // 신청 내역: 교사·과목·학반만 한 줄씩(제목을 누르면 정렬). 관리자는 여러 줄을 골라 한 번에 취소(선생님은 '자세히'에서 본인 신청만 한 건씩).
  // '자세히'를 누르면 그 교사의 요일·교시별 내역(배정·취소)이 펼쳐진다
  const reqs = [...data.reqs].sort((a, b) => slotOrder(a.slot) - slotOrder(b.slot) || a.id - b.id);
  if (!reqs.length) { picks.clear(); $('list').innerHTML = '<div class="empty">아직 신청이 없습니다. 위에서 이름을 고르고 수업을 선택해 신청하세요.</div>'; return; }
  const groups = new Map();
  for (const r of reqs) { const k = r.teacher + '|' + r.subject; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  const clsKey = c => c[0] + (c[1] === '전' ? 0 : 1) + c.slice(2);   // 학년 → 전기반 → 신재생반 순
  const list = [...groups].map(([k, rows]) => ({ k, rows, teacher: rows[0].teacher, subject: rows[0].subject,
    cls: [...new Set(rows.map(r => r.cls))].sort((a, b) => clsKey(a).localeCompare(clsKey(b))), can: admin }));   // can = 골라서 한 번에 취소(관리자만)
  const sortVal = g => (sortBy === 'cls' ? clsKey(g.cls[0]) : g[sortBy]);
  list.sort((a, b) => sortDir * sortVal(a).localeCompare(sortVal(b), 'ko') || a.teacher.localeCompare(b.teacher, 'ko'));
  for (const k of [...picks]) if (!list.some(g => g.k === k && g.can)) picks.delete(k);   // 없어졌거나 취소할 수 없게 된 줄은 선택에서 뺌
  const canAny = list.filter(g => g.can), nPick = list.filter(g => picks.has(g.k)).reduce((t, g) => t + g.rows.length, 0);
  const th = (key, label) => `<th aria-sort="${sortBy === key ? (sortDir > 0 ? 'ascending' : 'descending') : 'none'}"><button type="button" class="sort" data-sort="${key}">${label}<span aria-hidden="true">${sortBy === key ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</span></button></th>`;
  h = (canAny.length ? `<div class="bulk"><button type="button" id="bulkDel"${nPick ? '' : ' disabled'}>선택한 신청 취소${nPick ? ` (${nPick}건)` : ''}</button></div>` : '')
    + `<table class="sum"><thead><tr><th class="ck">${canAny.length ? `<input type="checkbox" id="pickAllReq" aria-label="취소할 수 있는 신청 모두 선택"${canAny.every(g => picks.has(g.k)) ? ' checked' : ''}>` : ''}</th>${th('teacher', '교사')}${th('subject', '과목')}${th('cls', '학반')}<th></th></tr></thead><tbody>`;
  for (const g of list) {
    const open = openReq === g.k;
    h += `<tr class="g"><td class="ck">${g.can ? `<input type="checkbox" data-pick="${esc(g.k)}" aria-label="${esc(g.teacher)} ${esc(g.subject)} 신청 선택"${picks.has(g.k) ? ' checked' : ''}>` : ''}</td><td>${esc(g.teacher)}</td><td>${esc(g.subject)}</td><td class="l">${g.cls.map(esc).join(', ')}</td>`
      + `<td><button type="button" class="more" data-open="${esc(g.k)}" aria-expanded="${open}">${open ? '접기' : '자세히'}</button></td></tr>`;
    if (!open) continue;
    h += '<tr class="d"><td colspan="5"><table><tbody>';
    for (const r of g.rows) {
      let cell;
      if (admin) {
        const opts = freeRooms(r.slot);
        cell = `<select data-assign="${r.id}"><option value="">${r.room ? '배정 취소' : '대기 (실 선택)'}</option>`
          + (r.room ? `<option value="${r.room}" selected>${roomLabel(r, r.room)}</option>` : '')
          + opts.map(c => `<option value="${c}">${roomLabel(r, c)}</option>`).join('') + '</select>'
          + (!r.room && !opts.length ? ' <small class="err">빈 실 없음</small>' : '');
      } else cell = r.room ? `<b class="ok">${roomLabel(r, r.room)}</b>` : '<span class="wait">배정 대기</span>';
      h += `<tr><td>${r.slot[0]} ${r.slot[1]}교시</td><td>${esc(r.cls)}</td><td>${md(r.from)}부터</td><td class="l">${cell}</td>`
        + `<td>${r.mine || admin ? `<button class="x" data-del="${r.id}">취소</button>` : ''}</td></tr>`;
    }
    h += '</tbody></table></td></tr>';
  }
  $('list').innerHTML = h + '</tbody></table>';
}

// 배치도 한 장: 위 줄 · 복도 · 아래 줄(+ 양옆 통칸). 실습실 칸만 단추이고 그 날짜에 이용가능한 실만 눌린다(관리자는 모두)
function planHtml(pl, iso, n, admin) {
  const cell = ([name, w, code]) => {
    if (!code) return `<div class="pc" style="flex:${w} 1 0"><span>${esc(name)}</span></div>`;
    const ok = availOn(code, iso), never = !ok && data.never.includes(code), from = data.avail[code];
    let free = 0;
    if (ok) for (let p = 1; p <= n; p++) { const sl = slotAt(iso, p); if (sl && !(data.base[code] && data.base[code][sl]) && !data.reqs.some(r => r.room === code && r.slot === sl && iso >= startOf(r))) free++; }
    const st = ok ? `빈 ${free}` : from ? md(from).split('(')[0] + '~' : '';
    const why = ok ? '이용가능' : never ? '교실 이용불가' : from ? md(from) + '부터' : '수업 불가';
    return `<button type="button" class="pc pr ${ok ? 'on' : never ? 'never' : 'off'}" style="flex:${w} 1 0" data-plan="${code}" aria-pressed="${sel === code}"${ok || admin ? '' : ' disabled'} title="${esc(roomName(code))}실습실 — ${why}${data.pc.includes(code) ? ' · PC 사용가능' : ''}"><b>${code}</b><span>${SHORT[code] || esc(roomName(code))}</span>${data.pc.includes(code) ? PCMARK : ''}${st ? `<em>${st}</em>` : ''}</button>`;
  };
  const row = cells => `<div class="prow">${cells.map(cell).join('')}</div>`;
  const cw = (pl.top || pl.bottom).reduce((t, c) => t + c[1], 0), side = c => (c ? `<div class="pside" style="flex:${c[1]} 1 0">${cell(c)}</div>` : '');
  return `<div class="plan">${side(pl.left)}<div class="pcol" style="flex:${cw} 1 0">${pl.top ? row(pl.top) : ''}<div class="pmid">${esc(pl.mid)}</div>${row(pl.bottom)}</div>${side(pl.right)}</div>`;
}

// 실 하나의 이름 줄 + 1~7교시 줄. inPlan = 배치도에서 누른 실('닫기' 단추), 아니면 층별 표의 한 줄(수업 불가 실은 접혀 있고 '보기'로 펼침)
function roomHtml(code, iso, n, admin, inPlan) {
  const name = (data.rooms.find(r => r[0] === code) || ['', ''])[1];
  const ok = availOn(code, iso), from = data.avail[code], shut = !ok;
  const never = shut && data.never.includes(code);   // 교실 이용불가 실: 더 어둡게
  const tag = ok ? '<span class="badge">이용가능</span>' : `<span class="shutlab">${from ? md(from).split('(')[0] + '부터' : never ? '교실 이용불가' : '수업 불가'}</span>`;
  let h = `<section class="room${shut ? ' closed' : ' open'}${never ? ' never' : ''}" data-room="${code}"><header>${admin ? `<input type="checkbox" data-avail="${code}"${ok ? ' checked' : ''} aria-label="${code} 이용가능">` : ''}<span class="code">${code}</span><span class="rname">${esc(name)}</span>${data.pc.includes(code) ? PCMARK : ''}${tag}${inPlan ? `<button type="button" class="more" data-plan="${code}">닫기</button>` : shut ? `<button type="button" class="more" data-more="${code}" aria-expanded="${shown.has(code)}">${shown.has(code) ? '접기' : '보기'}</button>` : ''}</header>`;
  if (!inPlan && shut && !shown.has(code)) return h + '</section>';   // 접힌 수업 불가 실
  h += '<ol class="strip">';
  for (let p = 1; p <= 7; p++) {
    const slot = p <= n && slotAt(iso, p), no = `<i>${p}</i>`;
    const b = slot && data.base[code] && data.base[code][slot];
    const a = slot && data.reqs.find(r => r.room === code && r.slot === slot && iso >= startOf(r));
    if (p > n) h += `<li class="out" aria-label="${p}교시 없음"></li>`;
    else if (b) { const [c, s, t] = b.split(' '); h += `<li class="${shut ? 'shut' : 'busy'}">${no}<b>${esc(c)}</b><small>${esc(s)}</small><small>${esc(t)}</small></li>`; }
    else if (a) h += `<li class="done">${no}<b>${esc(a.cls)}</b><small>${esc(a.subject)}</small><small>${esc(a.teacher)}</small></li>`;
    else if (ok && admin) {   // 관리자: 누를 수 있는 빈 실 칸 + 그 시간에 기다리는 신청 수
      const wait = data.reqs.filter(r => !r.room && r.slot === slot).length, key = code + '|' + slot;
      h += `<li class="free"><button type="button" data-free="${key}" aria-expanded="${openCell === key}">${no}<b>빈 실</b>${wait ? `<small>대기 ${wait}건</small>` : ''}</button></li>`;
    }
    else h += ok ? `<li class="free">${no}<b>빈 실</b></li>` : `<li class="${shut ? 'shut' : 'na'}">${no}</li>`;
  }
  h += '</ol>';
  if (admin && openCell.startsWith(code + '|')) {   // 누른 빈 실 칸 아래: 그 요일교시에 배정을 기다리는 신청 목록
    const sl = openCell.split('|')[1], cands = data.reqs.filter(r => !r.room && r.slot === sl);
    h += `<div class="putbox"><b>${sl[0]} ${sl[1]}교시</b>`
      + (cands.length ? cands.map(r => `<button type="button" data-put="${r.id}|${code}">${esc(r.cls)} ${esc(r.subject)} ${esc(r.teacher)} <small>${md(r.from)}부터</small></button>`).join('') : '<span class="hint">이 시간에 배정을 기다리는 신청이 없습니다.</span>')
      + '<button type="button" class="x" data-put="">닫기</button></div>';
  }
  return h + '</section>';
}

const api = (method, body, q = '') => fetch('/api/winter' + q, { method, headers: H({ 'Content-Type': 'application/json' }), body: body && JSON.stringify(body) })
  .then(r => r.json()).catch(() => ({ error: '인터넷 연결을 확인해 주세요' }));

$('send').addEventListener('click', async () => {
  // 빈 칸은 보내기 전에 바로 알려 준다 (서버도 같은 내용을 다시 확인)
  if (!me) { say('교사명을 목록에서 골라 주세요'); $('teacher').focus(); return; }
  if (!picked.size) { say('시간표에서 옮기고 싶은 수업 칸을 눌러 골라 주세요'); return; }
  if (!$('from').value) { say('언제부터 이동할지 날짜를 골라 주세요'); $('from').focus(); return; }
  const slots = [...picked].sort((a, b) => slotOrder(a) - slotOrder(b));
  $('send').disabled = true;
  const r = await api('POST', { teacher: me, from: $('from').value, slots });
  $('send').disabled = false;
  if (r.ok) { say(`신청되었습니다: ${slots.map(k => k[0] + k[1]).join(', ')} — ${md($('from').value)}부터`, true); picked.clear(); }
  else say(r.error);
  load();
});

$('list').addEventListener('click', async e => {
  const o = e.target.closest('button[data-open]'), so = e.target.closest('button[data-sort]');
  if (o) { openReq = openReq === o.dataset.open ? '' : o.dataset.open; render(); return; }
  if (so) { if (sortBy === so.dataset.sort) sortDir = -sortDir; else { sortBy = so.dataset.sort; sortDir = 1; } render(); return; }
  if (e.target.closest('#bulkDel')) {   // 고른 줄의 신청을 한 번에 취소
    const ids = data.reqs.filter(r => picks.has(r.teacher + '|' + r.subject)).map(r => r.id);
    if (!ids.length || !confirm(`선택한 신청 ${ids.length}건을 모두 취소할까요?`)) return;
    let done = 0, err = '';
    for (const id of ids) { const r = await api('DELETE', null, '?id=' + id); if (r.ok) done++; else err = r.error; }
    picks.clear();
    say(err ? `${done}건 취소, ${ids.length - done}건은 취소하지 못했습니다: ${err}` : `${done}건을 취소했습니다`, !err);
    load(); return;
  }
  const b = e.target.closest('button[data-del]');
  if (!b || !confirm('이 신청을 취소할까요?')) return;
  const r = await api('DELETE', null, '?id=' + b.dataset.del);
  say(r.ok ? '취소했습니다' : r.error, r.ok);
  load();
});
$('list').addEventListener('change', async e => {
  const pk = e.target.closest('input[data-pick]');
  if (pk) { if (pk.checked) picks.add(pk.dataset.pick); else picks.delete(pk.dataset.pick); render(); return; }
  if (e.target.id === 'pickAllReq') { picks.clear(); if (e.target.checked) document.querySelectorAll('#list input[data-pick]').forEach(c => picks.add(c.dataset.pick)); render(); return; }
  const s = e.target.closest('select[data-assign]');
  if (!s) return;
  const r = await api('PATCH', { id: Number(s.dataset.assign), room: s.value });
  say(r.ok ? (s.value ? `${s.value}에 배정했습니다` : '배정을 취소했습니다') : r.error, r.ok);
  s.blur(); load();
});
$('grid').addEventListener('change', async e => {
  const c = e.target.closest('input[data-avail]');
  if (!c) return;
  // 교실 이용불가 실습실을 이용가능으로 풀려 하면 한 번 더 묻는다
  const code0 = c.dataset.avail, why = data.never.includes(code0) ? '교실 이용불가 실습실' : '';
  if (c.checked && why && !confirm(`${code0} ${roomName(code0)}은(는) ${why}입니다.\n이용가능으로 해제하시겠습니까?`)) { c.checked = false; return; }
  // 켜면 지금 보고 있는 날짜부터 이용가능, 끄면 표시를 아예 없앰
  const avail = { ...data.avail }, iso = $('vdate').value;
  if (c.checked) avail[c.dataset.avail] = iso; else delete avail[c.dataset.avail];
  const r = await api('PUT', { avail });
  say(r.ok ? (c.checked ? `${c.dataset.avail}: ${md(iso)}부터 이용가능으로 표시했습니다` : `${c.dataset.avail} 이용가능 표시를 껐습니다`) : r.error, r.ok);
  load();
});
// 관리자: 빈 실 칸을 누르면 아래에 신청 목록, 신청을 누르면 그 실에 배정
$('grid').addEventListener('click', async e => {
  const f = e.target.closest('button[data-free]'), p = e.target.closest('button[data-put]'), m = e.target.closest('button[data-plan]');
  if (m) { sel = sel === m.dataset.plan ? '' : m.dataset.plan; openCell = ''; render(); return; }   // 배치도의 실(또는 '닫기')
  const mo = e.target.closest('button[data-more]');
  if (mo) { const c = mo.dataset.more; if (shown.has(c)) shown.delete(c); else shown.add(c); render(); return; }   // 층별 표의 '보기/접기'
  if (f) { openCell = openCell === f.dataset.free ? '' : f.dataset.free; render(); return; }
  if (!p) return;
  if (!p.dataset.put) { openCell = ''; render(); return; }
  const [id, room] = p.dataset.put.split('|');
  const r = await api('PATCH', { id: Number(id), room });
  say(r.ok ? `${room}에 배정했습니다` : r.error, r.ok);
  openCell = ''; load();
});
// 관리자 로그인: 비밀번호를 서버에 확인받아 맞을 때만 관리자 화면으로
$('adminForm').addEventListener('submit', async e => {
  e.preventDefault();
  const v = $('pw').value;
  if (!v) { $('adminMsg').textContent = '비밀번호를 입력해 주세요'; $('pw').focus(); return; }
  PW = v; $('adminMsg').textContent = ''; $('login').disabled = true;
  await load();
  $('login').disabled = false;
  if (data && data.admin) { try { sessionStorage.setItem('winterPw', PW); } catch {} $('pw').value = ''; }
  else { PW = ''; $('adminMsg').textContent = data ? '비밀번호가 맞지 않습니다' : '확인하지 못했습니다. 인터넷 연결을 확인해 주세요'; $('pw').select(); }
});
$('logout').addEventListener('click', () => { PW = ''; try { sessionStorage.removeItem('winterPw'); } catch {} load(); });
for (const [id, v] of [['tabTable', 'table'], ['tabPlan', 'plan']]) $(id).addEventListener('click', () => { view = v; try { localStorage.setItem('winterView', v); } catch {} render(); });
$('vdate').addEventListener('change', () => { if (data && $('vdate').value < minDate()) $('vdate').value = minDate(); render(); });
$('prev').addEventListener('click', () => { const d = addDays($('vdate').value, -1); if (d >= minDate()) { $('vdate').value = d; render(); } });
$('next').addEventListener('click', () => { $('vdate').value = addDays($('vdate').value, 1); render(); });

load();
setInterval(load, 20000);   // 다른 선생님 신청·배정 결과가 20초마다 보이도록
</script>
</body>
</html>
