<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>솥밥 메뉴 선택</title>
<!-- 글꼴(Pretendard): 불러오지 못하면 기기 기본 글꼴로 보인다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    --bg: #f6f4ef; --surface: #fff; --text: #1d1b18; --muted: #66625a; --line: #e3dfd6;
    --accent: #8a3a12;      /* 강조색(무쇠솥 누룽지 갈색): 선택·제출 버튼에만 */
    --accent-soft: #f6ebe3;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--text); background: var(--bg); word-break: keep-all; -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px calc(40px + env(safe-area-inset-bottom)); }
  h1 { font-size: 26px; line-height: 1.3; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: -12px 0 28px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; }
  .due { margin: -20px 0 28px; font-weight: 700; color: var(--accent); }   /* 마감 시간: 안내문과 줄을 나눠 눈에 띄게 */
  label.lbl { display: block; font-weight: 600; margin-bottom: 8px; }
  input[type=text] { width: 100%; height: 52px; padding: 0 14px; font: inherit; font-size: 18px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--text); }
  input:focus { outline: none; border-color: var(--accent); }
  fieldset { border: 0; padding: 0; margin: 24px 0 0; }
  legend { font-weight: 600; margin-bottom: 8px; padding: 0; }
  .opts { display: grid; gap: 8px; }
  .opt { position: relative; display: flex; align-items: center; min-height: 56px; padding: 0 16px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); font-size: 18px; font-weight: 600; cursor: pointer; }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt::after { content: ""; margin-left: auto; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line); }
  .opt:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .opt:has(input:checked)::after { border: 7px solid var(--accent); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt.skip { font-weight: 500; color: var(--muted); margin-top: 4px; }   /* 불참은 메뉴와 구분되게 한 단계 약하게 */
  button { width: 100%; height: 56px; margin-top: 24px; border: 0; border-radius: var(--radius); background: var(--accent); color: #fff; font: inherit; font-size: 18px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { min-height: 24px; margin: 12px 0 0; font-weight: 600; }
  .msg.ok { color: #1f6b3a; } .msg.err { color: #b3261e; }

  /* 결과 보기(/lunch/admin) */
  .big { display: flex; gap: 12px; margin-bottom: 16px; }
  .big div { flex: 1; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .big span { display: block; color: var(--muted); font-size: 15px; }
  .big b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .tally { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .tally li { padding: 12px 16px; border-top: 1px solid var(--line); }
  .tally li:first-child { border-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-weight: 600; }
  .row b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .names { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .foot { margin: 12px 0 0; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <!-- 주문하는 화면(/lunch): 결과는 보이지 않는다 -->
  <div id="order" hidden>
    <h1>솥밥 메뉴 선택</h1>
    <p class="sub">점심식사 참여 여부와 메뉴를 선택해주세요.</p>
    <p class="due">12시 10분까지 선택해주세요.</p>
    <dl class="info"><dt>장소</dt><dd>울산 북구 곡리8길 7 1층 고래온 (인근 주차 가능)</dd><dt>시간</dt><dd>2시~2시30분</dd></dl>
    <form id="f" novalidate>
      <label class="lbl" for="name">이름</label>
      <input id="name" type="text" autocomplete="name" maxlength="20" placeholder="예: 홍길동" required>
      <fieldset>
        <legend>메뉴</legend>
        <div class="opts" id="opts"><p class="muted">불러오는 중…</p></div>
      </fieldset>
      <button id="go" type="submit" disabled>제출</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </div>

  <!-- 결과 보기(/lunch/admin): 비밀번호 없이 바로 보인다. 주소는 단톡방에 올리지 않는다 -->
  <div id="admin" hidden>
    <h1>솥밥 주문 결과</h1>
    <p class="sub">이 주소는 담당 선생님만 봐 주세요.</p>
    <div class="big"><div><span>식사</span><b id="eat">0</b></div><div><span>불참</span><b id="skip">0</b></div></div>
    <ul class="tally" id="tally"></ul>
    <p class="foot" id="when">불러오는 중…</p>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ADMIN = /\/admin\/?$/.test(location.pathname);
const get = (k, store = localStorage) => { try { return store.getItem(k) || ''; } catch { return ''; } };
const put = (k, v, store = localStorage) => { try { v ? store.setItem(k, v) : store.removeItem(k); } catch {} };

if (!ADMIN) {
  // ── 주문 ──
  $('order').hidden = false;
  $('name').value = get('lunchName');
  fetch('/api/lunch', { cache: 'no-store' }).then(r => r.json()).then(d => {
    const last = get('lunchMenu');   // 이 기기에서 지난번에 낸 메뉴를 미리 골라 둠
    $('opts').innerHTML = d.menus.map((m, i) =>
      `<label class="opt${i === d.menus.length - 1 ? ' skip' : ''}"><input type="radio" name="menu" value="${esc(m)}"${m === last ? ' checked' : ''}>${esc(m)}</label>`).join('');
    $('go').disabled = false;
  }).catch(() => { $('opts').innerHTML = '<p class="msg err">불러오지 못했습니다. 새로고침해 주세요.</p>'; });

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('name').value.trim(), sel = document.querySelector('input[name=menu]:checked'), msg = $('msg');
    msg.className = 'msg err';
    if (!name) { msg.textContent = '이름을 써 주세요.'; $('name').focus(); return; }
    if (!sel) { msg.textContent = '메뉴를 골라 주세요.'; return; }
    $('go').disabled = true; msg.className = 'msg'; msg.textContent = '보내는 중…';
    try {
      const r = await fetch('/api/lunch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, menu: sel.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || '제출하지 못했습니다.');
      put('lunchName', name); put('lunchMenu', d.menu);
      msg.className = 'msg ok'; msg.textContent = `${d.name} 님 · ${d.menu}으로 접수됐습니다.`;
    } catch (err) { msg.className = 'msg err'; msg.textContent = err.message + ' 다시 눌러 주세요.'; }
    $('go').disabled = false;
  });
} else {
  // ── 결과 보기 ──
  document.title = '솥밥 주문 결과';
  $('admin').hidden = false;
  async function load() {
    try {
      const r = await fetch('/api/lunch?all=1', { cache: 'no-store' });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      const by = Object.fromEntries(d.menus.map(m => [m, []]));
      for (const x of d.list) (by[x.menu] || (by[x.menu] = [])).push(x.name);
      const skip = by[d.menus[d.menus.length - 1]].length;
      $('eat').textContent = d.list.length - skip; $('skip').textContent = skip;
      $('tally').innerHTML = Object.keys(by).map(m =>
        `<li><div class="row"><span>${esc(m)}</span><b>${by[m].length}</b></div>${by[m].length ? `<div class="names">${by[m].map(esc).join(', ')}</div>` : ''}</li>`).join('');
      $('when').textContent = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' 기준 · 15초마다 새로 고침';
    } catch { $('when').textContent = '새로 불러오지 못했습니다(인터넷 연결 확인)'; }
    setTimeout(load, 15000);
  }
  load();
}
</script>
</body>
</html>
